title: Lev’s Literature
description: A collection of thoughts, stories, and things left unsaid.

# If your repository is named <username>.github.io, leave baseurl empty.
# Otherwise set it to "/your-repository-name" (see README, step 4).
baseurl: "/lev-literature"
url: ""

markdown: kramdown

collections:
  works:
    output: true
    permalink: /writing/:name/

defaults:
  - scope:
      path: ""
      type: works
    values:
      layout: work
  - scope:
      path: "about.md"
    values:
      layout: about

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - setup
  - vendor
  - node_modules
 kramdown:
  hard_wrap: true
