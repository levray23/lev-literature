- name: Poetry
  nav: Poems
  tagline: Where feelings find their rhythm.
  intro: A collection of poems born from the things that move us, haunt us, and
    stay long after a moment has passed. Here, love, longing, grief, and wonder
    find their way into words, sometimes through rhyme, sometimes through
    silence. Each poem is an attempt to give shape to what the heart knows but
    struggles to explain.
  noun: poems
  url: /poetry/
  theme: poetry
  numeral: I
  image: /assets/site/hero-poetry.svg
- name: Prose
  nav: Prose
  tagline: Thoughts that refuse to remain unspoken.
  intro: These are pieces written in the spaces between feeling and understanding.
    Through personal reflections, intimate observations, and deliberate turns of
    thought, this shelf explores the complexities of love, human nature, and the
    experiences that make us question what we believe. Not every piece arrives
    at an answer; some exist simply to ask better questions.
  noun: prose pieces
  url: /prose/
  theme: prose
  numeral: II
  image: /assets/site/hero-prose.svg
