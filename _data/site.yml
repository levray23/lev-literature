tagline: For all that we cannot leave unsaid.
hero_image: /assets/site/hero.svg
archive_statement: "An archive of poems, prose, and philosophical reflections on
  love, existence, and the contradictions of being human. "
about_teaser: Behind every written word is a mind still learning, questioning,
  and becoming. If you'd like to know the person behind these pages — the
  thoughts, experiences, and curiosities that shape them — you're welcome to
  read a little more about me.
footer_note: Written in the pursuit of understanding, kept in the hope of being
  understood. Thank you for spending a little of your time here.
